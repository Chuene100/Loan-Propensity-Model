# Training pipeline configuration.
#
# Paths accept either .csv or .parquet -- src/data_prep.py dispatches on
# the file extension. The original case-study data ships as Parquet;
# CSV is also supported since that's what the project skeleton assumed.

data:
  customers_path: data/customers.parquet
  loans_path: data/loans.parquet
  transactions_path: data/transactions.parquet

spark:
  app_name: loan_propensity_training
  # Small on purpose for this dataset's scale -- see the docstring on
  # get_spark_session() in src/utils.py for why.
  shuffle_partitions: 8

split:
  test_fraction: 0.2
  seed: 42

output:
  model_path: models/loan_propensity_spark_pipeline
  metrics_path: reports/training_metrics.yaml
  eda_report_path: reports/eda_report.yaml
  prospect_scores_path: reports/prospect_scores.parquet
  burn_rate_trend_plot_path: "reports/burn_rate_trend.png"
  top_burners_plot_path: "reports/top_burners.png"
  variance_plot_path: "reports/variance_plot.png"
  vif_plot_path: "reports/vif_plot.png"
  feature_selection_plot_path: "reports/feature_selection_plot.png"
  threshold_comparison_plot_path: "reports/threshold_comparison_plot.png"
  confusion_matrix_plot_path: "reports/confusion_matrix_plot.png"

model:
  reg_param: 0.1
  elastic_net_param: 0.0  # 0.0 = pure L2 (Ridge)